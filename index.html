<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ניהול תקלות</title>

<!-- הוספה למסך הבית (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תקלות">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --ink:#1B2430; --muted:#8A94A6; --border:#E4E7EC;
    --teal:#1F6F5C; --teal-soft:#E4F0EC; --amber:#C97A2B; --amber-soft:#FBEEE0;
    --red:#B23A48; --red-soft:#F8E6E8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;padding-bottom:40px;}
  h1,h2,.heebo{font-family:'Heebo',sans-serif;}
  button{cursor:pointer;font-family:inherit;}
  textarea,input{font-family:inherit;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-icon{width:34px;height:34px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
  .brand-name{font-weight:800;font-size:17px;}
  .icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .banner{margin:0 18px 8px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 10px;}
  .banner.error{color:var(--red);border-color:var(--red);background:var(--red-soft);}
  .role-toggle{display:flex;background:var(--surface);border-radius:999px;padding:4px;border:1px solid var(--border);margin:0 18px 14px;}
  .role-toggle button{flex:1;padding:9px 0;border-radius:999px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;}
  .role-toggle button.active{background:var(--ink);color:#fff;}
  .content{padding:0 18px;}
  .section-label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .icon{font-size:28px;margin-bottom:10px;opacity:.5;}
  .empty .title{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:4px;}
  .next-card{background:var(--surface);border-radius:22px;padding:20px;border:1px solid var(--border);box-shadow:0 12px 30px -18px rgba(27,36,48,.25);}
  .urgency-bar{width:100%;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
  .urgency-bar-fill{height:100%;transition:width 1s linear, background 1s linear;}
  .next-top{display:flex;align-items:center;gap:14px;margin:16px 0 4px;}
  .badge{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .badge-ring{position:absolute;inset:0;border-radius:50%;opacity:.16;}
  .badge.pulse .badge-ring{animation:pulseRing 1.8s ease-in-out infinite;}
  .badge-core{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
  @keyframes pulseRing{0%{transform:scale(1);opacity:.16}50%{transform:scale(1.18);opacity:.05}100%{transform:scale(1);opacity:.16}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;display:inline-block;}
  .next-text{font-weight:800;font-size:21px;line-height:1.25;}
  .next-wait{font-size:14px;font-weight:700;margin-bottom:18px;}
  .btn-row{display:flex;gap:10px;}
  .big-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border-radius:16px;border:none;color:#fff;font-weight:700;font-size:15px;}
  .big-btn.small{padding:10px 6px;font-size:13px;border-radius:12px;}
  .big-btn .ic{font-size:20px;}
  .minor-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px;}
  .minor-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:transparent;text-align:start;}
  .minor-text{flex:1;min-width:0;}
  .minor-title{font-weight:700;font-size:15px;}
  .minor-wait{font-size:12.5px;font-weight:600;margin-top:2px;}
  .minor-body{padding:0 14px 14px;display:flex;gap:8px;}
  .add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0;border-radius:14px;border:none;background:var(--ink);color:#fff;font-weight:700;font-size:15px;margin-bottom:18px;}
  .drag-hint{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .mgr-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;touch-action:none;user-select:none;}
  .mgr-card.primary{border-color:var(--teal);}
  .mgr-card.dragging{opacity:.6;transform:scale(1.02);}
  .mgr-stripe{width:6px;align-self:stretch;border-radius:3px;background:var(--teal);}
  .mgr-text{flex:1;min-width:0;}
  .mgr-title{font-weight:700;font-size:15px;}
  .mgr-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .mgr-retry{font-size:12px;color:var(--amber);background:transparent;border:none;padding:0;margin-top:2px;font-weight:700;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(27,36,48,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--surface);width:100%;max-width:480px;border-top-left-radius:24px;border-top-right-radius:24px;padding:20px 20px 28px;max-height:85vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.15);}
  .modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;}
  .modal h2{font-weight:700;font-size:19px;margin:0 0 14px;}
  .field-label{font-size:13px;color:var(--muted);margin-bottom:6px;}
  textarea.input{width:100%;border-radius:12px;border:1px solid var(--border);padding:12px;font-size:15px;resize:none;margin-bottom:14px;outline:none;}
  .photo-picker{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border-radius:12px;border:1.5px dashed var(--border);color:var(--muted);font-weight:600;font-size:14px;margin-bottom:14px;}
  .photo-picker img{max-height:120px;border-radius:8px;}
  .modal-submit{width:100%;padding:13px 0;border-radius:12px;border:none;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .history-item{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;}
  .history-top{display:flex;justify-content:space-between;gap:8px;}
  .history-title{font-weight:700;font-size:14px;}
  .undo-btn{display:flex;align-items:center;gap:4px;border:none;background:transparent;color:var(--teal);font-weight:700;font-size:13px;flex-shrink:0;}
  .history-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);}
  .status-chip{padding:2px 8px;border-radius:999px;font-weight:700;}
  .status-chip.fixed{background:var(--teal-soft);color:var(--teal);}
  .status-chip.cannot{background:var(--red-soft);color:var(--red);}
  .reason-box{background:var(--red-soft);border-radius:12px;padding:12px;font-size:14px;margin-bottom:10px;}
  .reason-box .lbl{font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =======================================================================
   CONFIG — after deploying the Apps Script as a Web App, paste its URL
   here (Deploy > New deployment > Web app > copy the URL that ends in /exec)
======================================================================= */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwKlbwePoENfeg06zWN2qzaknof2MFIgot6Ds3WBipSDr-VeNuNCkpXxzT_OL7VUbrL3w/exec"
};

const POLL_MS = 15000;

const T = {
  he: { dir:"rtl", appName:"ניהול תקלות", roleManager:"מנהל", roleWorker:"עובד",
    nextTask:"המשימה הבאה", moreTasks:"משימות נוספות", noTasks:"אין משימות כרגע",
    noTasksSub:"כשתתווסף משימה, היא תופיע כאן.", fixed:"תוקן", cannotFix:"אי אפשר לתקן",
    cannotFixTitle:"אי אפשר לתקן", cannotFixSub:"אפשר להוסיף הסבר קצר ותמונה (לא חובה)",
    reasonPlaceholder:"מה קרה? (לא חובה)", attachPhoto:"צרף תמונה", send:"שמור",
    addTask:"הוספת משימה", whatToDo:"מה צריך לעשות?",
    taskPlaceholder:"לדוגמה: תיקון ברז במקלחת חדר 214", save:"שמור",
    translating:"מתרגם לספרדית...", history:"היסטוריה", historyEmpty:"עדיין אין משימות בהיסטוריה",
    undo:"ביטול", statusFixed:"תוקן", statusCannotFix:"אי אפשר לתקן", reason:"הסבר",
    retryTranslate:"נסה תרגום שוב", translateFailed:"התרגום נכשל", dragHint:"לחיצה ממושכת לשינוי סדר",
    connError:"לא ניתן להתחבר לגיליון. יש לוודא שכתובת ה-API הודבקה נכון בקובץ.",
    saving:"שומר..." },
  es: { dir:"ltr", appName:"Gestión de averías", roleManager:"Encargado", roleWorker:"Empleado",
    nextTask:"Próxima tarea", moreTasks:"Más tareas", noTasks:"No hay tareas por ahora",
    noTasksSub:"Cuando se agregue una tarea, aparecerá aquí.", fixed:"Resuelto", cannotFix:"No se puede reparar",
    cannotFixTitle:"No se puede reparar", cannotFixSub:"Puedes agregar una breve explicación y una foto (opcional)",
    reasonPlaceholder:"¿Qué pasó? (opcional)", attachPhoto:"Adjuntar foto", send:"Guardar",
    addTask:"Agregar tarea", whatToDo:"¿Qué hay que hacer?",
    taskPlaceholder:"Ej: Reparar grifo del baño, habitación 214", save:"Guardar",
    translating:"Traduciendo al español...", history:"Historial", historyEmpty:"Aún no hay tareas en el historial",
    undo:"Deshacer", statusFixed:"Resuelto", statusCannotFix:"No se pudo reparar", reason:"Explicación",
    retryTranslate:"Reintentar traducción", translateFailed:"Falló la traducción", dragHint:"Mantén presionado para reordenar",
    connError:"No se pudo conectar con la hoja de cálculo. Verifica que la URL de la API esté bien pegada en el archivo.",
    saving:"Guardando..." }
};

/* ---------------- state ---------------- */
const state = {
  role: localStorage.getItem('mt_role') || 'worker',
  lang: localStorage.getItem('mt_lang') || 'he',
  tasks: [],
  ready: false,
  connError: false,
  showAdd: false, addText: '', addSaving: false,
  showHistory: false, historyDetail: null,
  expandedId: null,
  cannotFixTaskId: null, reasonText: '', reasonPhoto: null, reasonSending: false,
  draggingId: null, orderPreview: null
};

function t(){ return T[state.lang]; }

/* ---------------- API helpers ---------------- */
async function apiGet(){
  const res = await fetch(CONFIG.API_URL, { method:'GET' });
  return res.json();
}
async function apiPost(payload){
  // text/plain avoids a CORS preflight that Apps Script handles poorly
  const res = await fetch(CONFIG.API_URL, {
    method:'POST',
    headers: { 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function refresh(){
  try{
    const r = await apiGet();
    if(r.ok){
      state.tasks = r.tasks;
      state.connError = false;
    } else {
      state.connError = true;
    }
  }catch(e){
    state.connError = true;
  }
  state.ready = true;
  render();
}

/* ---------------- utils ---------------- */
function uidLocal(){ return 'tmp'+Date.now(); }

function getElapsedInfo(createdAt){
  const diffMs = Math.max(0, Date.now() - new Date(createdAt).getTime());
  const days = Math.floor(diffMs/(1000*60*60*24));
  const level = days>=3 ? 'high' : days>=1 ? 'mid' : 'low';
  return {days, level};
}
function formatElapsedDays(days, lang){
  if(lang==='he'){
    if(days===0) return 'ממתינה פחות מיום';
    if(days===1) return 'ממתינה יום אחד';
    if(days===2) return 'ממתינה יומיים';
    return `ממתינה ${days} ימים`;
  }
  if(days===0) return 'Esperando menos de un día';
  if(days===1) return 'Esperando 1 día';
  return `Esperando ${days} días`;
}
function urgencyColor(level){ return level==='high' ? 'var(--red)' : level==='mid' ? 'var(--amber)' : 'var(--teal)'; }

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function compressImage(file, maxWidth=900, quality=0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- actions ---------------- */
function switchRole(r){ state.role = r; localStorage.setItem('mt_role', r); render(); }
function switchLang(){ state.lang = state.lang==='he'?'es':'he'; localStorage.setItem('mt_lang', state.lang); render(); }

async function handleAddTask(){
  const textHe = state.addText.trim();
  if(!textHe) return;
  state.addSaving = true; render();
  const r = await apiPost({ action:'add', textHe });
  state.addSaving = false;
  if(r.ok){ state.addText=''; state.showAdd=false; await refresh(); }
  else { alert(r.error || 'שגיאה'); render(); }
}

async function retryTranslate(id){
  const task = state.tasks.find(x=>x.id===id);
  if(task) task.translating = true;
  render();
  const r = await apiPost({ action:'retryTranslate', id });
  if(task) task.translating = false;
  if(r.ok && task) task.textEs = r.textEs;
  render();
}

async function completeFixed(id){
  await apiPost({ action:'complete', id, status:'fixed' });
  state.expandedId = null;
  await refresh();
}

function openCannotFixModal(id){
  state.cannotFixTaskId = id; state.reasonText=''; state.reasonPhoto=null; render();
}
async function submitCannotFix(){
  if(!state.cannotFixTaskId) return;
  state.reasonSending = true; render();
  const payload = { action:'complete', id: state.cannotFixTaskId, status:'cannot_fix', reasonText: state.reasonText.trim() };
  if(state.reasonPhoto) payload.reasonPhotoBase64 = state.reasonPhoto;
  await apiPost(payload);
  state.reasonSending = false; state.cannotFixTaskId = null; state.expandedId = null;
  await refresh();
}

async function undoTask(id){
  await apiPost({ action:'undo', id });
  state.historyDetail = null;
  await refresh();
}

async function onPickPhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  state.reasonPhoto = await compressImage(file);
  render();
}

/* ---------------- drag reorder (manager) ---------------- */
let dragCtx = { id:null, dragging:false, timer:null };
function activeSorted(){
  const src = state.orderPreview || state.tasks;
  return src.filter(x=>x.status==='active').sort((a,b)=> (Number(a.order)||0) - (Number(b.order)||0));
}

function onCardPointerDown(e, id){
  if(state.role!=='manager') return;
  const startY = e.clientY;
  dragCtx.id = id; dragCtx.dragging = false;
  dragCtx.timer = setTimeout(()=>{
    dragCtx.dragging = true;
    state.draggingId = id;
    state.orderPreview = state.tasks.map(x=>({...x}));
    if(navigator.vibrate) navigator.vibrate(15);
    render();
  }, 350);

  function onMove(ev){
    if(!dragCtx.dragging){
      if(Math.abs(ev.clientY-startY) > 12) clearTimeout(dragCtx.timer);
      return;
    }
    const container = document.getElementById('mgr-list');
    if(!container) return;
    const cards = Array.from(container.querySelectorAll('[data-task-card]'));
    const y = ev.clientY;
    const ordered = activeSorted();
    const currentIndex = ordered.findIndex(x=>x.id===dragCtx.id);
    for(let i=0;i<cards.length;i++){
      const rect = cards[i].getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      const targetId = cards[i].getAttribute('data-task-card');
      const targetIndex = ordered.findIndex(x=>x.id===targetId);
      if(targetId!==dragCtx.id && y<mid && targetIndex<currentIndex){
        reorderPreview(currentIndex, targetIndex); break;
      }
      if(targetId!==dragCtx.id && y>mid && targetIndex>currentIndex){
        reorderPreview(currentIndex, targetIndex); break;
      }
    }
  }
  function reorderPreview(fromIdx, toIdx){
    const ordered = activeSorted();
    const moved = ordered.splice(fromIdx,1)[0];
    ordered.splice(toIdx,0,moved);
    ordered.forEach((t,i)=> t.order = i);
    const others = state.tasks.filter(x=>x.status!=='active');
    state.orderPreview = ordered.concat(others);
    render();
  }
  async function onUp(){
    clearTimeout(dragCtx.timer);
    if(dragCtx.dragging){
      const finalOrder = activeSorted().map(x=>x.id);
      state.draggingId = null;
      const preview = state.orderPreview;
      state.orderPreview = null;
      state.tasks = preview;
      render();
      await apiPost({ action:'reorder', ids: finalOrder });
      await refresh();
    }
    dragCtx.id = null; dragCtx.dragging = false;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* ---------------- render ---------------- */
function render(){
  const lang = state.lang, tr = t(), dir = tr.dir;
  document.documentElement.dir = dir;
  document.body.dir = dir;

  if(!state.ready){
    document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><span class="spin" style="font-size:26px;">⏳</span></div>`;
    return;
  }

  const active = state.tasks.filter(x=>x.status==='active').sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
  const history = state.tasks.filter(x=>x.status!=='active').sort((a,b)=> new Date(b.completedAt)-new Date(a.completedAt));
  const primary = active[0] || null;
  const rest = active.slice(1);

  let html = `
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🛠️</div>
        <div class="brand-name">${esc(tr.appName)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${state.role==='manager' ? `<button class="icon-btn" onclick="state.showHistory=true;render()">🕐</button>` : ''}
        <button class="icon-btn" onclick="switchLang()">🌐</button>
      </div>
    </div>`;

  if(state.connError){
    html += `<div class="banner error">${esc(tr.connError)}</div>`;
  }

  html += `
    <div class="role-toggle">
      <button class="${state.role==='worker'?'active':''}" onclick="switchRole('worker')">👷 ${esc(tr.roleWorker)}</button>
      <button class="${state.role==='manager'?'active':''}" onclick="switchRole('manager')">🧑‍💼 ${esc(tr.roleManager)}</button>
    </div>
    <div class="content">`;

  if(state.role==='worker'){
    html += `<div class="section-label">${esc(tr.nextTask)}</div>`;
    if(!primary){
      html += emptyState(tr);
    } else {
      html += nextTaskCard(primary, lang, tr);
    }
    if(rest.length){
      html += `<div style="margin-top:26px;"><div class="section-label">${esc(tr.moreTasks)}</div>`;
      rest.forEach(task => html += minorTaskCard(task, lang, tr));
      html += `</div>`;
    }
  } else {
    html += `
      <button class="add-btn" onclick="state.showAdd=true;render()">➕ ${esc(tr.addTask)}</button>`;
    if(!active.length){
      html += emptyState(tr);
    } else {
      html += `<div class="drag-hint">${esc(tr.dragHint)}</div><div id="mgr-list">`;
      active.forEach((task,i) => html += managerTaskCard(task, i===0, tr));
      html += `</div>`;
    }
  }

  html += `</div>`; // .content

  // Modals
  if(state.showAdd) html += addModal(tr);
  if(state.cannotFixTaskId) html += cannotFixModal(tr, dir);
  if(state.showHistory) html += historyModal(history, lang, tr);
  if(state.historyDetail) html += historyDetailModal(state.historyDetail, lang, tr);

  document.getElementById('app').innerHTML = html;

  // attach pointerdown handlers for drag (manager)
  if(state.role==='manager'){
    document.querySelectorAll('[data-task-card]').forEach(el=>{
      el.addEventListener('pointerdown', (e)=> onCardPointerDown(e, el.getAttribute('data-task-card')));
    });
  }
}

function emptyState(tr){
  return `<div class="empty"><div class="icon">🔧</div><div class="title">${esc(tr.noTasks)}</div><div>${esc(tr.noTasksSub)}</div></div>`;
}

function badge(level, big){
  const size = big?84:44;
  const color = urgencyColor(level);
  return `<div class="badge ${level!=='low'?'pulse':''}" style="width:${size}px;height:${size}px;">
    <div class="badge-ring" style="background:${color};"></div>
    <div class="badge-core" style="width:${size*0.72}px;height:${size*0.72}px;background:${color};font-size:${big?32:16}px;">🔧</div>
  </div>`;
}

function nextTaskCard(task, lang, tr){
  const {days, level} = getElapsedInfo(task.createdAt);
  const text = lang==='he' ? task.textHe : (task.textEs || task.textHe);
  const pct = Math.min(100, (days/5)*100);
  return `
    <div class="next-card">
      <div class="urgency-bar"><div class="urgency-bar-fill" style="width:${pct}%;background:${urgencyColor(level)};"></div></div>
      <div class="next-top">
        ${badge(level, true)}
        <div class="next-text">${esc(text)}</div>
      </div>
      <div class="next-wait" style="color:${urgencyColor(level)};">${esc(formatElapsedDays(days,lang))}</div>
      <div class="btn-row">
        <button class="big-btn" style="background:var(--teal);" onclick="completeFixed('${task.id}')"><span class="ic">✅</span><span>${esc(tr.fixed)}</span></button>
        <button class="big-btn" style="background:var(--red);" onclick="openCannotFixModal('${task.id}')"><span class="ic">⚠️</span><span>${esc(tr.cannotFix)}</span></button>
      </div>
    </div>`;
}

function minorTaskCard(task, lang, tr){
  const {days, level} = getElapsedInfo(task.createdAt);
  const text = lang==='he' ? task.textHe : (task.textEs || task.textHe);
  const expanded = state.expandedId === task.id;
  return `
    <div class="minor-card">
      <button class="minor-head" onclick="state.expandedId = state.expandedId==='${task.id}'?null:'${task.id}'; render()">
        ${badge(level, false)}
        <div class="minor-text">
          <div class="minor-title">${esc(text)}</div>
          <div class="minor-wait" style="color:${urgencyColor(level)};">${esc(formatElapsedDays(days,lang))}</div>
        </div>
        <div>${expanded?'▲':'▼'}</div>
      </button>
      ${expanded ? `
      <div class="minor-body">
        <button class="big-btn small" style="background:var(--teal);" onclick="completeFixed('${task.id}')">✅ ${esc(tr.fixed)}</button>
        <button class="big-btn small" style="background:var(--red);" onclick="openCannotFixModal('${task.id}')">⚠️ ${esc(tr.cannotFix)}</button>
      </div>` : ''}
    </div>`;
}

function managerTaskCard(task, isPrimary, tr){
  const dragging = state.draggingId === task.id;
  let sub;
  if(task.translating){
    sub = `<div class="mgr-sub"><span class="spin">⏳</span> ${esc(tr.translating)}</div>`;
  } else if(task.textEs){
    sub = `<div class="mgr-sub">${esc(task.textEs)}</div>`;
  } else {
    sub = `<button class="mgr-retry" onclick="retryTranslate('${task.id}')">${esc(tr.translateFailed)} · ${esc(tr.retryTranslate)}</button>`;
  }
  return `
    <div class="mgr-card ${isPrimary?'primary':''} ${dragging?'dragging':''}" data-task-card="${task.id}">
      ${isPrimary?'<div class="mgr-stripe"></div>':''}
      <div class="mgr-text">
        <div class="mgr-title">${esc(task.textHe)}</div>
        ${sub}
      </div>
    </div>`;
}

function modalShell(title, bodyHtml, onCloseAttr){
  return `
    <div class="modal-backdrop" ${onCloseAttr}>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        ${title?`<h2>${esc(title)}</h2>`:''}
        ${bodyHtml}
      </div>
    </div>`;
}

function addModal(tr){
  return modalShell(tr.addTask, `
    <div class="field-label">${esc(tr.whatToDo)}</div>
    <textarea class="input" dir="rtl" rows="3" placeholder="${esc(tr.taskPlaceholder)}"
      oninput="state.addText=this.value" ${state.addSaving?'disabled':''}>${esc(state.addText)}</textarea>
    <button class="modal-submit" style="background:${state.addSaving||!state.addText.trim()?'var(--border)':'var(--teal)'};"
      onclick="handleAddTask()" ${state.addSaving?'disabled':''}>
      ${state.addSaving ? `<span class="spin">⏳</span> ${esc(tr.translating)}` : esc(tr.save)}
    </button>
  `, `onclick="${state.addSaving?'':'state.showAdd=false;render()'}"`);
}

function cannotFixModal(tr, dir){
  return modalShell(tr.cannotFixTitle, `
    <div class="field-label">${esc(tr.cannotFixSub)}</div>
    <textarea class="input" dir="${dir}" rows="3" placeholder="${esc(tr.reasonPlaceholder)}"
      oninput="state.reasonText=this.value" ${state.reasonSending?'disabled':''}>${esc(state.reasonText)}</textarea>
    <label class="photo-picker">
      ${state.reasonPhoto ? `<img src="${state.reasonPhoto}"/>` : `📷 ${esc(tr.attachPhoto)}`}
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPickPhoto(this)">
    </label>
    <button class="modal-submit" style="background:var(--red);" onclick="submitCannotFix()" ${state.reasonSending?'disabled':''}>
      ${state.reasonSending ? `<span class="spin">⏳</span>` : ''} ${esc(tr.send)}
    </button>
  `, `onclick="${state.reasonSending?'':"state.cannotFixTaskId=null;render()"}"`);
}

function historyModal(history, lang, tr){
  let body = '';
  if(!history.length){
    body = `<div style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0;">${esc(tr.historyEmpty)}</div>`;
  } else {
    history.forEach(task=>{
      const text = lang==='he' ? task.textHe : (task.textEs||task.textHe);
      const statusCls = task.status==='fixed' ? 'fixed' : 'cannot';
      const statusLbl = task.status==='fixed' ? tr.statusFixed : tr.statusCannotFix;
      const dateStr = task.completedAt ? new Date(task.completedAt).toLocaleString(lang==='he'?'he-IL':'es-ES', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      body += `
        <div class="history-item" onclick='openHistoryDetail(${JSON.stringify(task.id)})'>
          <div class="history-top">
            <div class="history-title">${esc(text)}</div>
            <button class="undo-btn" onclick="event.stopPropagation();undoTask('${task.id}')">↩️ ${esc(tr.undo)}</button>
          </div>
          <div class="history-meta">
            <span class="status-chip ${statusCls}">${esc(statusLbl)}</span>
            <span>${esc(dateStr)}</span>
          </div>
        </div>`;
    });
  }
  return modalShell(tr.history, body, `onclick="state.showHistory=false;render()"`);
}

function openHistoryDetail(id){
  state.historyDetail = state.tasks.find(x=>x.id===id) || null;
  render();
}

function historyDetailModal(task, lang, tr){
  const text = lang==='he' ? task.textHe : (task.textEs||task.textHe);
  const statusCls = task.status==='fixed' ? 'fixed' : 'cannot';
  const statusLbl = task.status==='fixed' ? tr.statusFixed : tr.statusCannotFix;
  let body = `<div class="status-chip ${statusCls}" style="display:inline-block;margin-bottom:12px;">${esc(statusLbl)}</div>`;
  if(task.reasonText){
    body += `<div class="reason-box"><div class="lbl">${esc(tr.reason)}</div>${esc(task.reasonText)}</div>`;
  }
  if(task.reasonPhotoUrl){
    body += `<img src="${esc(task.reasonPhotoUrl)}" style="width:100%;border-radius:12px;"/>`;
  }
  return modalShell(text, body, `onclick="state.historyDetail=null;render()"`);
}

/* ---------------- boot ---------------- */
if(CONFIG.API_URL.indexOf('PASTE_YOUR') !== -1){
  document.getElementById('app').innerHTML = `<div style="padding:24px;font-family:sans-serif;line-height:1.7;">
    <h2>⚠️ עוד לא הוגדרה כתובת ה-API</h2>
    <p>פותחים את הקובץ בעורך טקסט, ומחליפים בשורה <code>API_URL</code> את הטקסט
    <code>PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE</code> בכתובת ה-Web App שקיבלתם אחרי פריסת ה-Apps Script (מסתיימת ב-/exec).</p>
  </div>`;
} else {
  refresh();
  setInterval(refresh, POLL_MS);
}
</script>
</body>
</html>
