<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reparaciones</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        textarea, input, button { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        button { cursor: pointer; font-weight: bold; border: none; color: white; transition: 0.2s; }
        .btn-gray { background-color: #6c757d; } .btn-green { background-color: #198754; } .btn-red { background-color: #dc3545; }
        
        .task-card { background: #fdfdfd; margin-bottom: 12px; border-radius: 8px; border: 1px solid #e1e1e1; overflow: hidden; transition: all 0.3s ease; }
        .task-header { padding: 15px; font-size: 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .task-actions { padding: 15px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .task-actions button { margin-bottom: 0; flex: 1; padding: 15px; font-size: 16px; }
        
        .first-task-card { border: 2px solid #0056b3; box-shadow: 0 4px 12px rgba(0,86,179,0.15); }
        .first-task-card .task-header { font-size: 24px; font-weight: bold; color: #0056b3; padding: 20px; cursor: default; }
        .first-task-card .task-actions { padding: 20px; border-top: 2px solid #eee; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
        .sync-indicator { font-size: 12px; color: #888; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container" id="worker-screen">
        <h2>Lista de Reparaciones</h2>
        <div id="sync-indicator" class="sync-indicator hidden">🔄 Sincronizando...</div>
        <div id="worker-list"></div>
    </div>

    <div class="modal hidden" id="cant-fix-modal">
        <div class="modal-content">
            <h3 style="color: #dc3545; text-align: center;">⚠️ No se puede</h3>
            <textarea id="worker-note" rows="3" placeholder="¿Qué pasó? (Opcional)"></textarea>
            <input type="file" id="worker-img" accept="image/*" capture="environment">
            <button class="btn-red" id="save-modal-btn" onclick="saveCantFix()">Guardar (שמור)</button>
            <button class="btn-gray" onclick="closeModal()">Cancelar (ביטול)</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwMMOW3IHeeWJGq7rsS0ptkl_JmiI01i39fhAFUOoHuLdLWPTQsu_Da8TIki0xCNqLTDA/exec";
        let tasks = JSON.parse(localStorage.getItem('tasks_worker')) || [];
        let currentTaskId = null;
        let isSyncing = false;

        async function syncFromCloud() {
            if (isSyncing) return;
            isSyncing = true;
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if(data && data.tasks && JSON.stringify(tasks) !== JSON.stringify(data.tasks)) {
                    tasks = data.tasks;
                    localStorage.setItem('tasks_worker', JSON.stringify(tasks));
                    renderWorker();
                }
            } catch (e) { console.log("Sync error"); }
            isSyncing = false;
        }

        async function saveTasks() {
            localStorage.setItem('tasks_worker', JSON.stringify(tasks)); 
            document.getElementById('sync-indicator').classList.remove('hidden');
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ actionType: 'SAVE_ALL', tasks: tasks }) });
            } catch (e) {}
            document.getElementById('sync-indicator').classList.add('hidden');
        }

        async function translateText(text, from, to) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
                const data = await res.json();
                return data.responseData.translatedText;
            } catch (e) { return text; }
        }

        function getDaysWaiting(task) {
            const createdAt = task.createdAt || Math.floor(task.id); 
            return Math.floor((Date.now() - createdAt) / (1000 * 60 * 60 * 24));
        }

        function renderWorker() {
            const list = document.getElementById('worker-list');
            list.innerHTML = '';
            const activeTasks = tasks.filter(t => t.status === 'active');
            
            activeTasks.forEach((task, index) => {
                const isFirst = index === 0;
                const days = getDaysWaiting(task);
                const daysText = days === 0 ? 'Hoy' : `Hace ${days} días`;
                
                const card = document.createElement('div');
                card.className = 'task-card' + (isFirst ? ' first-task-card' : '');
                
                card.innerHTML = `
                    <div class="task-header" ${isFirst ? '' : `onclick="toggleCard(${task.id})"`}>
                        <div><span>🔧 ${task.es}</span><br><span style="font-size: 13px; color: #888;">⏳ ${daysText}</span></div>
                        ${isFirst ? '' : '<span>🔽</span>'}
                    </div>
                    <div class="task-actions ${isFirst ? '' : 'hidden'}" id="actions-${task.id}">
                        <button class="btn-green" onclick="markFixed(${task.id})">✅ Reparado</button>
                        <button class="btn-red" onclick="openCantFix(${task.id})">⚠️ No se puede</button>
                    </div>
                `;
                list.appendChild(card);
            });
            if (list.innerHTML === '') list.innerHTML = '<h3 style="text-align:center; color:#888;">No hay tareas 🎉</h3>';
        }

        function toggleCard(id) {
            const target = document.getElementById(`actions-${id}`);
            const isHidden = target.classList.contains('hidden');
            document.querySelectorAll('.task-actions').forEach(el => {
                if (!el.parentElement.classList.contains('first-task-card')) el.classList.add('hidden');
            });
            if (isHidden) target.classList.remove('hidden');
        }

        function markFixed(id) {
            const t = tasks.find(t => t.id === id);
            if (t) { t.action = 'fixed'; t.status = t.requireVerification ? 'pending' : 'history'; saveTasks(); renderWorker(); }
        }

        function openCantFix(id) {
            currentTaskId = id; document.getElementById('worker-note').value = ''; document.getElementById('worker-img').value = ''; document.getElementById('cant-fix-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('cant-fix-modal').classList.add('hidden'); }

        async function saveCantFix() {
            const noteEs = document.getElementById('worker-note').value.trim();
            const fileInput = document.getElementById('worker-img');
            document.getElementById('save-modal-btn').disabled = true;
            
            const t = tasks.find(t => t.id === currentTaskId);
            if (!t) return closeModal();

            t.noteHe = noteEs ? await translateText(noteEs, 'es', 'he') : '';
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(400 / img.width, 1);
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        t.img = canvas.toDataURL('image/jpeg', 0.3); 
                        finalizeCantFix(t);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else { finalizeCantFix(t); }
        }

        function finalizeCantFix(t) {
            t.action = 'cant_fix'; t.status = t.requireVerification ? 'pending' : 'history';
            saveTasks(); document.getElementById('save-modal-btn').disabled = false; closeModal(); renderWorker();
        }

        window.onload = () => { renderWorker(); syncFromCloud(); };
        setInterval(syncFromCloud, 10000);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
