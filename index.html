<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות / Tareas</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* עיצוב בסיסי לאפליקציה */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        h2 { text-align: center; color: #333; margin-top: 0; }
        
        input, textarea, button { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; font-family: inherit; }
        
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #004494; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        .logout-btn { background-color: #6c757d; margin-bottom: 25px; }
        .logout-btn:hover { background-color: #5a6268; }
        
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { background: #fdfdfd; margin-bottom: 12px; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e1e1e1; }
        
        .done { text-decoration: line-through; color: #999; }
        .delete-btn { background-color: #dc3545; width: auto; padding: 8px 12px; margin: 0; font-size: 14px; }
        
        .checkbox-container { display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer;}
        input[type="checkbox"] { width: 22px; height: 22px; margin: 0; cursor: pointer; }
        .task-text { font-size: 18px; }
        
        .loader { font-size: 14px; color: #0056b3; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- מסך התחברות -->
    <div class="container" id="login-screen">
        <h2>התחברות / Iniciar sesión</h2>
        <p style="text-align: center; color: #555;">הכנס קוד גישה / Ingrese el código</p>
        <input type="password" id="pin-input" placeholder="קוד / Código" pattern="[0-9]*" inputmode="numeric">
        <button onclick="checkPin()">היכנס / Entrar</button>
        <p id="login-error" style="color: #dc3545; text-align: center;" class="hidden">קוד שגוי / Código incorrecto</p>
    </div>

    <!-- מסך מנהל (עברית) -->
    <div class="container hidden" id="manager-screen">
        <h2>ניהול משימות</h2>
        <button onclick="logout()" class="logout-btn">התנתק (חזור למסך כניסה)</button>
        
        <label for="task-input" style="display:block; margin-bottom: 8px; font-weight:bold;">הוסף משימות (כל שורה היא משימה נפרדת):</label>
        <textarea id="task-input" rows="5" placeholder="לדוגמה:&#10;לנקות את המטבח&#10;לסדר את המחסן&#10;להוציא פח"></textarea>
        <button onclick="addTasks()" id="add-btn">תרגם והוסף משימות</button>
        <div id="loading" class="loader hidden">מתרגם את המשימות לספרדית, אנא המתן...</div>

        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 5px;">משימות פעילות:</h3>
        <ul id="manager-list"></ul>
    </div>

    <!-- מסך עובד (ספרדית) -->
    <div class="container hidden" id="worker-screen">
        <h2>Lista de Tareas</h2>
        <button onclick="logout()" class="logout-btn">Cerrar sesión</button>
        
        <ul id="worker-list"></ul>
    </div>

    <script>
        // שמירת המשימות בזיכרון המקומי של הדפדפן
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // מערכת התחברות
        function checkPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === '1234') {
                showManager();
            } else if (pin === '1111') {
                showWorker();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('manager-screen').classList.add('hidden');
            document.getElementById('worker-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.body.dir = 'rtl'; // ברירת מחדל עברית למסך התחברות
        }

        function showManager() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('manager-screen').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.body.dir = 'rtl'; // כיוון טקסט לעברית
            renderManager();
        }

        function showWorker() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('worker-screen').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.body.dir = 'ltr'; // כיוון טקסט לספרדית (משמאל לימין)
            renderWorker();
        }

        // הוספת משימות (כולל פיצול שורות ותרגום אוטומטי)
        async function addTasks() {
            const input = document.getElementById('task-input').value.trim();
            if (!input) return;

            // מפצל את הטקסט לשורות ומוחק שורות ריקות
            const lines = input.split('\n').map(line => line.trim()).filter(line => line !== '');
            if (lines.length === 0) return;

            // הצגת מסך טעינה
            document.getElementById('add-btn').disabled = true;
            document.getElementById('loading').classList.remove('hidden');

            // לולאה שעוברת על כל שורה ומתרגמת אותה
            for (let line of lines) {
                let hebrewText = line;
                let spanishText = hebrewText; // ברירת מחדל במקרה של שגיאה

                try {
                    // שימוש ב-API חינמי לתרגום
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(hebrewText)}&langpair=he|es`);
                    const data = await response.json();
                    if (data && data.responseData && data.responseData.translatedText) {
                        spanishText = data.responseData.translatedText;
                    }
                } catch (error) {
                    console.error('שגיאה בתרגום:', error);
                }

                // דחיפת המשימה החדשה לרשימה
                tasks.push({
                    id: Date.now() + Math.random(),
                    he: hebrewText,
                    es: spanishText,
                    done: false
                });
            }

            saveTasks();
            document.getElementById('task-input').value = '';
            document.getElementById('add-btn').disabled = false;
            document.getElementById('loading').classList.add('hidden');
            renderManager();
        }

        // סימון משימה כבוצעה
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveTasks();
                // עדכון המסך הרלוונטי
                if (!document.getElementById('manager-screen').classList.contains('hidden')) renderManager();
                if (!document.getElementById('worker-screen').classList.contains('hidden')) renderWorker();
            }
        }

        // מחיקת משימה (רק למנהל)
        function deleteTask(id) {
            if(confirm('האם אתה בטוח שברצונך למחוק משימה זו?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderManager();
            }
        }

        // רינדור (ציור) מסך המנהל
        function renderManager() {
            const list = document.getElementById('manager-list');
            list.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                
                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.textContent = task.he + (task.done ? ' (בוצע ✔️)' : '');
                if (task.done) textSpan.classList.add('done');

                const delBtn = document.createElement('button');
                delBtn.textContent = 'מחק';
                delBtn.className = 'delete-btn';
                delBtn.onclick = () => deleteTask(task.id);

                li.appendChild(textSpan);
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        // רינדור (ציור) מסך העובד
        function renderWorker() {
            const list = document.getElementById('worker-list');
            list.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                
                const container = document.createElement('label');
                container.className = 'checkbox-container';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.done;
                checkbox.onchange = () => toggleTask(task.id);

                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.textContent = task.es;
                if (task.done) textSpan.classList.add('done');

                container.appendChild(checkbox);
                container.appendChild(textSpan);
                li.appendChild(container);
                
                list.appendChild(li);
            });
        }

        // רישום ה-Service Worker כדי שהאפליקציה תעבוד גם כ-PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
