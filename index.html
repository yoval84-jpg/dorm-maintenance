<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות / Tareas</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        input, textarea, button { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        button { cursor: pointer; font-weight: bold; border: none; color: white; transition: 0.2s; }
        .btn-blue { background-color: #0056b3; } .btn-blue:hover { background-color: #004494; }
        .btn-gray { background-color: #6c757d; margin-bottom: 25px; } .btn-gray:hover { background-color: #5a6268; }
        .btn-green { background-color: #198754; } .btn-green:hover { background-color: #157347; }
        .btn-red { background-color: #dc3545; } .btn-red:hover { background-color: #bb2d3b; }
        
        .task-card { background: #fdfdfd; margin-bottom: 12px; border-radius: 8px; border: 1px solid #e1e1e1; overflow: hidden; transition: all 0.3s ease; }
        .task-header { padding: 15px; font-size: 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .task-header:hover { background: #f8f9fa; }
        .task-actions { padding: 15px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .task-actions button { margin-bottom: 0; flex: 1; padding: 15px; font-size: 16px; }
        
        .first-task-card { border: 2px solid #0056b3; box-shadow: 0 4px 12px rgba(0,86,179,0.15); }
        .first-task-card .task-header { font-size: 24px; font-weight: bold; color: #0056b3; padding: 20px; cursor: default; }
        .first-task-card .task-header:hover { background: #fdfdfd; }
        .first-task-card .task-actions { padding: 20px; border-top: 2px solid #eee; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
        
        .manager-list { list-style: none; padding: 0; }
        .manager-list li { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; position: relative; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 10px; }
        .badge-green { background: #198754; } .badge-red { background: #dc3545; } .badge-orange { background: #fd7e14; }
        .task-img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        
        .drag-handle { font-size: 24px; color: #adb5bd; cursor: grab; padding-right: 10px; user-select: none; }
        .drag-handle:active { cursor: grabbing; color: #495057; }
        .sortable-ghost { opacity: 0.4; background-color: #f8f9fa; }
        
        .toggle-history-btn { background: transparent; color: #333; font-size: 22px; width: auto; margin: 0; padding: 5px; border: none; box-shadow: none; border-radius: 50%; }
        .toggle-history-btn:hover { background: #e9ecef; }
    </style>
</head>
<body>

    <!-- מסך התחברות -->
    <div class="container" id="login-screen">
        <h2>התחברות / Iniciar sesión</h2>
        <input type="password" id="pin-input" placeholder="קוד / Código" inputmode="numeric">
        <button class="btn-blue" onclick="checkPin()">היכנס / Entrar</button>
        <p id="login-error" style="color: #dc3545; text-align: center;" class="hidden">קוד שגוי / Código incorrecto</p>
    </div>

    <!-- מסך מנהל -->
    <div class="container hidden" id="manager-screen">
        <h2>ניהול משימות</h2>
        <button class="btn-gray" onclick="logout()">התנתק (חזור למסך כניסה)</button>
        
        <textarea id="task-input" rows="4" placeholder="הכנס משימות (כל שורה משימה נפרדת)"></textarea>
        <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer; font-weight: bold;">
            <input type="checkbox" id="require-verification" style="width: 20px; margin: 0;">
            🔍 דרוש וידוא מנהל לאחר ביצוע
        </label>
        <button class="btn-blue" id="add-btn" onclick="addTasks()">תרגם והוסף משימות</button>
        <p id="loading" class="hidden" style="color: #0056b3; text-align: center;">מעבד נתונים...</p>

        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px;">משימות פעילות (ניתן לגרור לתעדוף)</h3>
        <ul id="list-active" class="manager-list"></ul>

        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px; color: #fd7e14;">ממתין לווידוא מנהל</h3>
        <ul id="list-pending" class="manager-list"></ul>

        <!-- כותרת היסטוריה עם כפתור שעון -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-top: 30px; padding-bottom: 5px;">
            <h3 style="margin: 0; color: #6c757d; border: none; padding: 0;">היסטוריה (הושלם)</h3>
            <button class="toggle-history-btn" onclick="toggleHistory()" title="הצג/הסתר היסטוריה">🕒</button>
        </div>
        <ul id="list-history" class="manager-list hidden"></ul>
    </div>

    <!-- מסך עובד -->
    <div class="container hidden" id="worker-screen">
        <h2>Lista de Tareas</h2>
        <button class="btn-gray" onclick="logout()">Cerrar sesión</button>
        <div id="worker-list"></div>
    </div>

    <!-- מודל דיווח אי אפשר לתקן (לעובד) -->
    <div class="modal hidden" id="cant-fix-modal">
        <div class="modal-content">
            <h3 style="color: #dc3545; text-align: center;">⚠️ No se puede</h3>
            <textarea id="worker-note" rows="3" placeholder="¿Qué pasó? (Opcional)"></textarea>
            <input type="file" id="worker-img" accept="image/*" capture="environment">
            <button class="btn-red" id="save-modal-btn" onclick="saveCantFix()">Guardar (שמור)</button>
            <button class="btn-gray" onclick="closeModal()">Cancelar (ביטול)</button>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks_v2')) || [];
        let currentTaskId = null;
        let activeSortable = null;

        function saveTasks() { localStorage.setItem('tasks_v2', JSON.stringify(tasks)); }

        async function translateText(text, from, to) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
                const data = await res.json();
                return data.responseData.translatedText;
            } catch (e) { return text; }
        }

        function checkPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === '1234') { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('manager-screen').classList.remove('hidden'); document.body.dir = 'rtl'; renderManager(); }
            else if (pin === '1111') { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('worker-screen').classList.remove('hidden'); document.body.dir = 'ltr'; renderWorker(); }
            else { document.getElementById('login-error').classList.remove('hidden'); }
            document.getElementById('pin-input').value = '';
        }

        function logout() { location.reload(); }

        function toggleHistory() {
            const historyList = document.getElementById('list-history');
            historyList.classList.toggle('hidden');
        }

        // חישוב ימים שעברו
        function getDaysWaiting(task) {
            // תמיכה לאחור במשימות ישנות שאין להן תאריך יצירה שמור
            const createdAt = task.createdAt || Math.floor(task.id); 
            const days = Math.floor((Date.now() - createdAt) / (1000 * 60 * 60 * 24));
            return days;
        }

        async function addTasks() {
            const input = document.getElementById('task-input').value.trim();
            const reqVerify = document.getElementById('require-verification').checked;
            if (!input) return;
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');
            
            document.getElementById('add-btn').disabled = true;
            document.getElementById('loading').classList.remove('hidden');

            for (let line of lines) {
                let spanishText = await translateText(line, 'he', 'es');
                tasks.push({
                    id: Date.now() + Math.random(),
                    createdAt: Date.now(),
                    he: line,
                    es: spanishText,
                    requireVerification: reqVerify,
                    status: 'active',
                    action: null,
                    noteHe: '',
                    img: null
                });
            }
            saveTasks();
            document.getElementById('task-input').value = '';
            document.getElementById('require-verification').checked = false;
            document.getElementById('add-btn').disabled = false;
            document.getElementById('loading').classList.add('hidden');
            renderManager();
        }

        function renderManager() {
            const listActive = document.getElementById('list-active');
            const listPending = document.getElementById('list-pending');
            const listHistory = document.getElementById('list-history');
            
            listActive.innerHTML = ''; listPending.innerHTML = ''; listHistory.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                const days = getDaysWaiting(task);
                const daysText = days === 0 ? 'נוצר היום' : `ממתין ${days} ימים`;
                const waitHtml = `<div style="font-size: 13px; color: #888; margin-bottom: 5px;">⏳ ${daysText}</div>`;
                
                if (task.status === 'active') {
                    li.dataset.id = task.id; 
                    let html = `<div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div>
                                        <strong>${task.he}</strong><br>
                                        ${waitHtml}
                                        `;
                    if (task.requireVerification) html += `<span class="badge badge-orange" style="margin-top:5px;">דורש וידוא</span>`;
                    html += `<br><button class="btn-red" style="padding:5px 10px; margin-top:10px; width:auto;" onclick="deleteTask(${task.id})">מחק</button>
                                    </div>
                                    <div class="drag-handle">☰</div>
                                </div>`;
                    li.innerHTML = html;
                    listActive.appendChild(li);
                } 
                else if (task.status === 'pending') {
                    let html = `<strong>${task.he}</strong><br>${waitHtml}`;
                    const badgeClass = task.action === 'fixed' ? 'badge-green' : 'badge-red';
                    const badgeText = task.action === 'fixed' ? 'תוקן ✅' : 'לא תוקן ⚠️';
                    html += `<span class="badge ${badgeClass}" style="margin-top:5px;">${badgeText}</span><br>`;
                    if (task.noteHe) html += `<p style="margin:5px 0; background:#f0f0f0; padding:8px; border-radius:5px;"><strong>הערת עובד:</strong> ${task.noteHe}</p>`;
                    if (task.img) html += `<img src="${task.img}" class="task-img">`;
                    html += `<br><button class="btn-blue" style="margin-top:10px;" onclick="approveTask(${task.id})">סמן כתקין (העבר להיסטוריה)</button>`;
                    li.innerHTML = html;
                    listPending.appendChild(li);
                } 
                else if (task.status === 'history') {
                    let html = `<strong>${task.he}</strong><br>${waitHtml}`;
                    const badgeClass = task.action === 'fixed' ? 'badge-green' : 'badge-red';
                    const badgeText = task.action === 'fixed' ? 'תוקן ✅' : 'לא תוקן ⚠️';
                    html += `<span class="badge ${badgeClass}" style="margin-top:5px;">${badgeText}</span>`;
                    if (task.noteHe) html += `<br><span style="font-size:14px; color:#555;">${task.noteHe}</span>`;
                    if (task.img) html += `<br><img src="${task.img}" class="task-img" style="max-width:150px;">`;
                    li.innerHTML = html;
                    listHistory.appendChild(li);
                }
            });

            if (activeSortable) activeSortable.destroy();
            activeSortable = Sortable.create(listActive, {
                animation: 150,
                handle: '.drag-handle', 
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const newOrderIds = Array.from(listActive.children).map(li => Number(li.dataset.id));
                    const activeTasks = newOrderIds.map(id => tasks.find(t => t.id === id));
                    const otherTasks = tasks.filter(t => t.status !== 'active');
                    
                    tasks = [...activeTasks, ...otherTasks]; 
                    saveTasks(); 
                }
            });
        }

        function deleteTask(id) {
            if(confirm('למחוק משימה?')) { tasks = tasks.filter(t => t.id !== id); saveTasks(); renderManager(); }
        }
        function approveTask(id) {
            const t = tasks.find(t => t.id === id);
            if (t) { t.status = 'history'; saveTasks(); renderManager(); }
        }

        // --- פונקציות לעובד ---
        function renderWorker() {
            const list = document.getElementById('worker-list');
            list.innerHTML = '';
            
            const activeTasks = tasks.filter(t => t.status === 'active');
            
            activeTasks.forEach((task, index) => {
                const isFirst = index === 0;
                
                const days = getDaysWaiting(task);
                const daysText = days === 0 ? 'Hoy' : `Hace ${days} días`;
                
                const card = document.createElement('div');
                card.className = 'task-card' + (isFirst ? ' first-task-card' : '');
                
                const arrow = isFirst ? '' : '<span>🔽</span>';
                const actionsHidden = isFirst ? '' : 'hidden';
                const toggleFunc = isFirst ? '' : `onclick="toggleCard(${task.id})"`;
                
                card.innerHTML = `
                    <div class="task-header" ${toggleFunc}>
                        <div>
                            <span>🔧 ${task.es}</span><br>
                            <span style="font-size: 13px; color: #888; font-weight: normal;">⏳ ${daysText}</span>
                        </div>
                        ${arrow}
                    </div>
                    <div class="task-actions ${actionsHidden}" id="actions-${task.id}">
                        <button class="btn-green" onclick="markFixed(${task.id})">✅ Reparado</button>
                        <button class="btn-red" onclick="openCantFix(${task.id})">⚠️ No se puede</button>
                    </div>
                `;
                list.appendChild(card);
            });
            
            if (list.innerHTML === '') list.innerHTML = '<h3 style="text-align:center; color:#888;">No hay tareas 🎉</h3>';
        }

        function toggleCard(id) {
            document.querySelectorAll('.task-actions').forEach(el => {
                if (!el.parentElement.classList.contains('first-task-card')) {
                    el.classList.add('hidden');
                }
            });
            document.getElementById(`actions-${id}`).classList.remove('hidden');
        }

        function markFixed(id) {
            const t = tasks.find(t => t.id === id);
            if (t) {
                t.action = 'fixed';
                t.status = t.requireVerification ? 'pending' : 'history';
                saveTasks(); renderWorker();
            }
        }

        function openCantFix(id) {
            currentTaskId = id;
            document.getElementById('worker-note').value = '';
            document.getElementById('worker-img').value = '';
            document.getElementById('cant-fix-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('cant-fix-modal').classList.add('hidden'); }

        async function saveCantFix() {
            const noteEs = document.getElementById('worker-note').value.trim();
            const fileInput = document.getElementById('worker-img');
            const btn = document.getElementById('save-modal-btn');
            
            btn.disabled = true; btn.innerText = 'Guardando...';
            
            const t = tasks.find(t => t.id === currentTaskId);
            if (!t) return closeModal();

            t.noteHe = noteEs ? await translateText(noteEs, 'es', 'he') : '';
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const scale = Math.min(MAX_WIDTH / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        t.img = canvas.toDataURL('image/jpeg', 0.6); 
                        finalizeCantFix(t);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finalizeCantFix(t);
            }
        }

        function finalizeCantFix(t) {
            t.action = 'cant_fix';
            t.status = t.requireVerification ? 'pending' : 'history';
            saveTasks();
            document.getElementById('save-modal-btn').disabled = false;
            document.getElementById('save-modal-btn').innerText = 'Guardar (שמור)';
            closeModal();
            renderWorker();
        }
    </script>
</body>
</html>
