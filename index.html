function markFixed(id) {
    const t = tasks.find(t => t.id === id);
    if (t) {
        t.action = 'fixed';
        // אם צריך וידוא -> עובר ל-pending (יחכה למנהל).
        // אם לא צריך וידוא -> עובר ישר ל-history.
        t.status = t.requireVerification ? 'pending' : 'history';
        saveTasks(); 
        renderWorker();
    }
}
